<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">   
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1 class="title">ROCK PAPER SCISSORS GAME</h1>
    
    <div class="scoreboard">
        <div class="score-item">
            <p>HUMAN</p>
            <span class="humanscore">0</span>
        </div>
        <div class="score-item">
            <p>COMPUTER</p>
            <span class="computerscore">0</span>
        </div>
    </div>

    <div class="main">
        <button class="input">🪨</button>
        <button class="input">📃</button>
        <button class="input">✂️</button>
    </div>

    <p class="helptext">Choose your option!</p>
    
    <div class="computer">
        <span class="output">😊</span>
    </div>
    
    <p class="comptext">Computer Choice</p>

    <p class="result"></p>
    
</body>
</html>
